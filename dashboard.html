<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Follow Tracker</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="32" height="32">
      <div>
        <h1>Follow Tracker</h1>
        <div class="sub" id="accountLine" data-i18n="noScanYet"></div>
      </div>
    </div>
    <div class="actions">
      <select id="accountSelect" hidden></select>
      <button id="scanBtn" class="primary" data-i18n="scanNow"></button>
      <button id="restartBtn" hidden data-i18n="restart"></button>
      <button id="pauseBtn" hidden data-i18n="pause"></button>
      <button id="cancelBtn" hidden data-i18n="stop"></button>
    </div>
  </header>

  <section id="progress" class="progress" hidden>
    <div class="progress-text" id="progressText"></div>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
  </section>

  <div id="message" class="message" hidden></div>
  <div id="notice" class="message" hidden></div>

  <section class="stats" id="stats"></section>

  <nav class="tabs" id="tabs"></nav>

  <section class="toolbar">
    <input id="search" type="search" data-i18n-placeholder="searchPlaceholder">
    <label class="chk"><input type="checkbox" id="hideVerified"> <span data-i18n="hideVerified"></span></label>
    <button id="exportBtn" data-i18n="exportCsv"></button>
  </section>

  <p class="hint" id="tabHint"></p>
  <p class="hint learn" id="learnStatus" hidden></p>
  <main id="list" class="list"></main>
  <div class="more"><button id="moreBtn" hidden data-i18n="showMore"></button></div>

  <footer class="foot">
    <span data-i18n="footer"></span>
    <button id="clearBtn" class="link" data-i18n="clearAll"></button>
  </footer>

  <script src="lib/i18n.js"></script>
  <script src="lib/core.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
